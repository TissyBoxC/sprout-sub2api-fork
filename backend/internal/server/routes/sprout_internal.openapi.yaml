openapi: 3.0.3
info:
  title: sprout-sub2api internal API
  version: 1.0.0
  description: |
    Private service API exposed by the sprout sub2api fork.
    It is disabled by default and requires a service token when enabled.
servers:
  - url: /
tags:
  - name: internal
    description: Service-to-service endpoints
paths:
  /internal/sprout/v1/runtime:
    get:
      tags:
        - internal
      operationId: getSproutInternalRuntime
      summary: Return the runtime capabilities of the AI gateway
      security:
        - serviceToken: []
      responses:
        "200":
          description: Runtime information for an authenticated service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SproutRuntimeEnvelope"
        "401":
          description: Missing or invalid service token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SproutErrorEnvelope"
  /internal/sprout/v1/ai-accounts:
    post:
      tags:
        - internal
      operationId: createSproutAIAccount
      summary: Create an AI execution account for a platform parent
      security:
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SproutAIAccountCreateRequest"
      responses:
        "200":
          description: Created provider account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SproutAIAccountEnvelope"
        "401":
          $ref: "#/components/responses/InternalAuthenticationFailure"
        "422":
          description: Invalid account parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SproutErrorEnvelope"
  /internal/sprout/v1/runtime-config:
    get:
      tags:
        - internal
      operationId: getSproutInternalRuntimeConfig
      summary: Read authoritative platform defaults and model latency
      security:
        - serviceToken: []
      responses:
        "200":
          description: Runtime defaults and model recommendations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SproutRuntimeConfigEnvelope"
        "401":
          $ref: "#/components/responses/InternalAuthenticationFailure"
  /internal/sprout/v1/child-policy:
    get:
      tags:
        - internal
      operationId: getSproutChildPolicy
      summary: Read the effective child policy the gateway enforces
      description: |
        Returns the age bands, model allowlists, token ceilings, and policy
        version bindings the fork is enforcing so the platform can align its
        own child-safety policy. The safety-boundary text and the internal
        service token are never returned.
      security:
        - serviceToken: []
      responses:
        "200":
          description: Effective child policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SproutChildPolicyEnvelope"
        "401":
          $ref: "#/components/responses/InternalAuthenticationFailure"
  /internal/sprout/v1/usage/{provider_account_id}:
    get:
      tags:
        - internal
      operationId: getSproutUsageReconciliation
      summary: Read aggregated, content-free usage for one provider account
      description: |
        Returns token, cost, and per-model totals for one controlled provider
        account so the platform can reconcile spend without reading sub2api
        tables. Prompt and response content is never returned. The query
        window defaults to the last day and is capped at 92 days.
      security:
        - serviceToken: []
      parameters:
        - $ref: "#/components/parameters/ProviderAccountID"
        - $ref: "#/components/parameters/UsageStartTime"
        - $ref: "#/components/parameters/UsageEndTime"
      responses:
        "200":
          description: Aggregated usage totals and per-model breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SproutUsageReconciliationEnvelope"
        "400":
          description: Invalid time range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SproutErrorEnvelope"
        "401":
          $ref: "#/components/responses/InternalAuthenticationFailure"
        "404":
          description: Controlled provider account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SproutErrorEnvelope"
  /internal/sprout/v1/ai-accounts/{provider_account_id}:
    get:
      tags:
        - internal
      operationId: getSproutAIAccount
      summary: Read one AI execution account
      security:
        - serviceToken: []
      parameters:
        - $ref: "#/components/parameters/ProviderAccountID"
      responses:
        "200":
          description: Provider account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SproutAIAccountEnvelope"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SproutErrorEnvelope"
    put:
      tags:
        - internal
      operationId: updateSproutAIAccount
      summary: Update provider status, balance, concurrency, and models
      security:
        - serviceToken: []
      parameters:
        - $ref: "#/components/parameters/ProviderAccountID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SproutAIAccountUpdateRequest"
      responses:
        "200":
          description: Updated provider account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SproutAIAccountEnvelope"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SproutErrorEnvelope"
    delete:
      tags:
        - internal
      operationId: deleteSproutAIAccount
      summary: Delete one controlled provider account
      description: |
        Deletes only accounts created by the platform with the controlled
        sprout_ username, platform ownership note, and @ai.sprout.local email
        domain. Deleting an already soft-deleted controlled account is
        idempotent. Ordinary users are never affected.
      security:
        - serviceToken: []
      parameters:
        - $ref: "#/components/parameters/ProviderAccountID"
      responses:
        "200":
          description: Controlled provider account deleted or already deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SproutAIAccountDeletedEnvelope"
        "400":
          description: Invalid provider account identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SproutErrorEnvelope"
        "401":
          $ref: "#/components/responses/InternalAuthenticationFailure"
        "404":
          description: Controlled provider account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SproutErrorEnvelope"
  /internal/sprout/v1/ai-accounts/{provider_account_id}/api-keys:
    post:
      tags:
        - internal
      operationId: createSproutAIAccountAPIKey
      summary: Create one provider API key
      security:
        - serviceToken: []
      parameters:
        - $ref: "#/components/parameters/ProviderAccountID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SproutAPIKeyCreateRequest"
      responses:
        "200":
          description: Created API key; api_key is returned once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SproutAPIKeyEnvelope"
  /internal/sprout/v1/ai-accounts/{provider_account_id}/api-keys/{api_key_id}/rotate:
    post:
      tags:
        - internal
      operationId: rotateSproutAIAccountAPIKey
      summary: Rotate one provider API key without a credential gap
      security:
        - serviceToken: []
      parameters:
        - $ref: "#/components/parameters/ProviderAccountID"
        - $ref: "#/components/parameters/APIKeyID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SproutAPIKeyCreateRequest"
      responses:
        "200":
          description: Replacement API key; api_key is returned once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SproutAPIKeyEnvelope"
  /internal/sprout/v1/ai-accounts/{provider_account_id}/api-keys/{api_key_id}:
    delete:
      tags:
        - internal
      operationId: deleteSproutAIAccountAPIKey
      summary: Delete one provider API key
      security:
        - serviceToken: []
      parameters:
        - $ref: "#/components/parameters/ProviderAccountID"
        - $ref: "#/components/parameters/APIKeyID"
      responses:
        "200":
          description: Key deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SproutDeletedEnvelope"
components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: service-token
      description: Service token configured through sprout.internal_api.token
  parameters:
    ProviderAccountID:
      name: provider_account_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^parent_[a-f0-9]{32}$"
    APIKeyID:
      name: api_key_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    UsageStartTime:
      name: start_time
      in: query
      required: false
      description: RFC3339 inclusive window start; defaults to 24 hours before end_time.
      schema:
        type: string
        format: date-time
    UsageEndTime:
      name: end_time
      in: query
      required: false
      description: RFC3339 inclusive window end; defaults to the request time.
      schema:
        type: string
        format: date-time
  responses:
    InternalAuthenticationFailure:
      description: Missing or invalid service token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SproutErrorEnvelope"
  schemas:
    SproutRuntimeConfig:
      type: object
      additionalProperties: false
      required:
        - default_balance_usd
        - default_concurrency
        - models
        - recommended_model
      properties:
        default_balance_usd:
          type: number
          minimum: 0
        default_concurrency:
          type: integer
          minimum: 0
        recommended_model:
          type: string
        models:
          type: array
          items:
            $ref: "#/components/schemas/SproutModelLatency"
    SproutModelLatency:
      type: object
      additionalProperties: false
      required:
        - model
        - status
        - recommended_for_new_accounts
      properties:
        model:
          type: string
        status:
          type: string
        primary_latency_ms:
          type: integer
          minimum: 0
        average_latency_7d_ms:
          type: integer
          minimum: 0
        recommended_for_new_accounts:
          type: boolean
    SproutRuntimeConfigEnvelope:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - request_id
        - data
        - error
      properties:
        schema_version:
          type: string
          const: "1.0.0"
        request_id:
          type: string
          minLength: 1
          maxLength: 128
        data:
          $ref: "#/components/schemas/SproutRuntimeConfig"
        error:
          type: "null"
    SproutChildPolicy:
      type: object
      additionalProperties: false
      required:
        - enabled
        - require_policy_version
        - default_age_band
        - inject_safety_boundary
        - policy_versions
        - age_bands
      properties:
        enabled:
          type: boolean
        require_policy_version:
          type: boolean
        default_age_band:
          type: string
        inject_safety_boundary:
          type: boolean
        policy_versions:
          type: array
          items:
            $ref: "#/components/schemas/SproutPolicyVersionBinding"
        age_bands:
          type: array
          items:
            $ref: "#/components/schemas/SproutAgeBandPolicy"
    SproutPolicyVersionBinding:
      type: object
      additionalProperties: false
      required:
        - version
        - age_band
      properties:
        version:
          type: string
        age_band:
          type: string
    SproutAgeBandPolicy:
      type: object
      additionalProperties: false
      required:
        - name
        - allowed_models
        - max_output_tokens
        - content_rating
      properties:
        name:
          type: string
        allowed_models:
          type: array
          items:
            type: string
        max_output_tokens:
          type: integer
          minimum: 0
        content_rating:
          type: string
    SproutChildPolicyEnvelope:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - request_id
        - data
        - error
      properties:
        schema_version:
          type: string
          const: "1.0.0"
        request_id:
          type: string
          minLength: 1
          maxLength: 128
        data:
          $ref: "#/components/schemas/SproutChildPolicy"
        error:
          type: "null"
    SproutUsageTotals:
      type: object
      additionalProperties: false
      required:
        - requests
        - input_tokens
        - output_tokens
        - total_tokens
        - cost_usd
        - actual_cost_usd
      properties:
        requests:
          type: integer
          minimum: 0
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
        cache_creation_tokens:
          type: integer
          minimum: 0
        cache_read_tokens:
          type: integer
          minimum: 0
        total_tokens:
          type: integer
          minimum: 0
        cost_usd:
          type: number
        actual_cost_usd:
          type: number
        average_duration_ms:
          type: number
    SproutUsageModelStat:
      type: object
      additionalProperties: false
      required:
        - model
        - requests
        - total_tokens
      properties:
        model:
          type: string
        requests:
          type: integer
          minimum: 0
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
        cache_creation_tokens:
          type: integer
          minimum: 0
        cache_read_tokens:
          type: integer
          minimum: 0
        total_tokens:
          type: integer
          minimum: 0
        cost_usd:
          type: number
        actual_cost_usd:
          type: number
    SproutUsageReconciliation:
      type: object
      additionalProperties: false
      required:
        - provider_account_id
        - user_id
        - start_time
        - end_time
        - totals
        - models
      properties:
        provider_account_id:
          type: string
        user_id:
          type: integer
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        totals:
          $ref: "#/components/schemas/SproutUsageTotals"
        models:
          type: array
          items:
            $ref: "#/components/schemas/SproutUsageModelStat"
    SproutUsageReconciliationEnvelope:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - request_id
        - data
        - error
      properties:
        schema_version:
          type: string
          const: "1.0.0"
        request_id:
          type: string
          minLength: 1
          maxLength: 128
        data:
          $ref: "#/components/schemas/SproutUsageReconciliation"
        error:
          type: "null"
    SproutAIAccountCreateRequest:
      type: object
      additionalProperties: false
      required:
        - provider_account_id
        - provider_account_email
        - password
        - concurrency_limit
      properties:
        provider_account_id:
          type: string
          pattern: "^parent_[a-f0-9]{32}$"
        provider_account_email:
          type: string
          format: email
        username:
          type: string
        password:
          type: string
          minLength: 16
        balance_usd:
          type: number
          minimum: 0
          description: |
            Optional opening balance. Omit this field to use the gateway's
            system default balance; send 0 explicitly only when the account
            must start at zero.
        concurrency_limit:
          type: integer
          minimum: 1
        allowed_models:
          type: array
          items:
            type: string
          description: |
            Account-level model allowlist. An empty array keeps group
            restrictions unchanged; a non-empty array is intersected with the
            group allowlist and enforced by the gateway.
    SproutAIAccountUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - active
            - suspended
            - disabled
        balance_usd:
          type: number
          minimum: 0
        concurrency_limit:
          type: integer
          minimum: 1
        allowed_models:
          type: array
          items:
            type: string
          description: |
            Replace the account-level model allowlist. Send an empty array to
            remove the account-level restriction.
        reason:
          type: string
    SproutAPIKeyCreateRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        quota_usd:
          type: number
          minimum: 0
        expires_in_days:
          type: integer
          minimum: 1
        rate_limit_5h:
          type: number
          minimum: 0
        rate_limit_1d:
          type: number
          minimum: 0
        rate_limit_7d:
          type: number
          minimum: 0
    SproutAIAccount:
      type: object
      additionalProperties: true
      required:
        - provider_account_id
        - user_id
        - status
        - balance_usd
        - concurrency_limit
      properties:
        provider_account_id:
          type: string
        user_id:
          type: integer
        status:
          type: string
        balance_usd:
          type: number
        concurrency_limit:
          type: integer
        allowed_models:
          type: array
          items:
            type: string
    SproutAIAccountEnvelope:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - request_id
        - data
        - error
      properties:
        schema_version:
          type: string
          const: "1.0.0"
        request_id:
          type: string
          minLength: 1
          maxLength: 128
        data:
          $ref: "#/components/schemas/SproutAIAccount"
        error:
          type: "null"
    SproutAIAccountDeletedEnvelope:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - request_id
        - data
        - error
      properties:
        schema_version:
          type: string
          const: "1.0.0"
        request_id:
          type: string
          minLength: 1
          maxLength: 128
        data:
          type: object
          additionalProperties: false
          required:
            - provider_account_id
            - deleted
          properties:
            provider_account_id:
              type: string
              pattern: "^parent_[a-f0-9]{32}$"
            deleted:
              type: boolean
              const: true
        error:
          type: "null"
    SproutAPIKey:
      type: object
      additionalProperties: false
      required:
        - user_id
        - api_key_id
        - api_key
      properties:
        user_id:
          type: integer
        api_key_id:
          type: integer
        name:
          type: string
        api_key:
          type: string
          writeOnly: true
        status:
          type: string
        quota_usd:
          type: number
        expires_at:
          type: string
          nullable: true
    SproutAPIKeyEnvelope:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - request_id
        - data
        - error
      properties:
        schema_version:
          type: string
          const: "1.0.0"
        request_id:
          type: string
          minLength: 1
          maxLength: 128
        data:
          $ref: "#/components/schemas/SproutAPIKey"
        error:
          type: "null"
    SproutDeletedEnvelope:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - request_id
        - data
        - error
      properties:
        schema_version:
          type: string
          const: "1.0.0"
        request_id:
          type: string
          minLength: 1
          maxLength: 128
        data:
          type: object
          additionalProperties: false
          required:
            - deleted
          properties:
            deleted:
              type: boolean
              const: true
        error:
          type: "null"
    SproutRuntimeEnvelope:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - request_id
        - data
        - error
      properties:
        schema_version:
          type: string
          const: "1.0.0"
        request_id:
          type: string
          minLength: 1
          maxLength: 128
        data:
          $ref: "#/components/schemas/SproutRuntime"
        error:
          type: "null"
    SproutRuntime:
      type: object
      additionalProperties: false
      required:
        - service
        - status
        - protocol_version
        - capabilities
      properties:
        service:
          type: string
          const: sprout-sub2api
        status:
          type: string
          const: running
        protocol_version:
          type: string
          const: "1.0.0"
        capabilities:
          type: array
          items:
            type: string
          contains:
            const: service_token_auth
    SproutErrorEnvelope:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - request_id
        - data
        - error
      properties:
        schema_version:
          type: string
          const: "1.0.0"
        request_id:
          type: string
          minLength: 1
          maxLength: 128
        data:
          type: "null"
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
            - retryable
          properties:
            code:
              type: string
              enum:
                - unauthenticated
            message:
              type: string
              minLength: 1
              maxLength: 256
            retryable:
              type: boolean
              const: false
